name: Provider CRD compatibility check

on:
  workflow_call:
    inputs:
      crd-glob:
        description: Repository-relative glob selecting CustomResourceDefinition YAML files
        required: true
        type: string
      mode:
        description: report or enforce
        required: false
        type: string
        default: report
      baseline-refs:
        description: Space-separated full Git SHAs
        required: true
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out provider repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check out contract-tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .contract-tests

      # Callers must pin this workflow by full commit SHA; see require_pinned_ref in steps.py.
      - name: Require a pinned reusable-workflow ref
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          CALLER_REPOSITORY: ${{ github.repository }}
        run: python3 .contract-tests/cmd/workflow-steps/steps.py require-pinned-ref

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install pinned CRD parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Run compatibility check
        env:
          CRD_GLOB: ${{ inputs.crd-glob }}
          MODE: ${{ inputs.mode }}
          BASELINE_REFS: ${{ inputs.baseline-refs }}
        run: python3 .contract-tests/cmd/workflow-steps/steps.py run crd

      - name: Summarize compatibility result
        if: always()
        working-directory: ${{ github.workspace }}
        run: python3 .contract-tests/cmd/workflow-steps/steps.py summarize crd

      - name: Archive report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crd-contract-report
          path: .contract-report
          include-hidden-files: true
