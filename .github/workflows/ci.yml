name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.26"

      - name: Install pinned tools
        run: |
          GOBIN="$PWD/bin" go install github.com/oasdiff/oasdiff@v1.33.0
          GOBIN="$PWD/bin" go install github.com/mikefarah/yq/v4@v4.45.1

      - name: Install Python test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt

      - name: Type-check
        run: |
          # Each module directory has its own checker.py, which mypy cannot check in one run.
          failed=0
          for file in cmd/contract-tests/cli.py modules/*/*.py; do
            python3 -m mypy "$file" || failed=1
          done
          exit "$failed"

      - name: Run tests
        env:
          OASDIFF: ${{ github.workspace }}/bin/oasdiff
          YQ: ${{ github.workspace }}/bin/yq
        run: |
          python3 -m compileall cmd modules
          python3 -m pytest modules/openapi-compat/tests modules/crd-compat/tests modules/coverage/tests cmd/action-pins/tests -v

  workflow-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.26"

      - name: Install pinned actionlint
        run: GOBIN="$PWD/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # actionlint also runs the runner's shellcheck on every run: script.
      - name: Lint workflows
        run: bin/actionlint

      - name: Check action pins against their version comments
        run: python3 cmd/action-pins/check_action_pins.py
