# Fixture ContractSet for the workflow self-test; see selftest/README.md.
apiVersion: contracts.rhoai.io/v1alpha1
kind: ContractSet
metadata:
  name: selftest
spec:
  contracts:
    - id: selftest-widgets-v1
      type: openapi
      declaredArtifact: selftest/openapi/widgets.yaml
      matchPath: "^/api/widgets/v1(/|$)"
      policy:
        oasdiffVersion: "1.33.0"
        yqVersion: "4.45.1"
      generator:
        adapter: openapi.static
        source: selftest/openapi/widgets.yaml
    # A Swagger 2.0 contract: converted to OpenAPI 3 before it is compared.
    - id: selftest-gadgets-v1
      type: openapi
      declaredArtifact: selftest/openapi/gadgets.swagger.json
      matchPath: "^/api/gadgets/v1(/|$)"
      policy:
        oasdiffVersion: "1.33.0"
        yqVersion: "4.45.1"
      generator:
        adapter: openapi.static
        source: selftest/openapi/gadgets.swagger.json
  # Not a served API: a kustomize CRD OpenAPI extension fixture exercised by
  # the manifest-compat renderer tests; excluded so the repo-wide OpenAPI
  # document scan does not demand a contract for it.
  exclusions:
    - path: modules/manifest-compat/tests/fixtures/renderers/kustomize/overlays/prod/openapi-definition.yaml
      reason: "kustomize CRD OpenAPI extension fixture for the manifest-compat renderer tests, not a served API"
