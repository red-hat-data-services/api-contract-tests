# Fixture ContractSet for the workflow self-test; see selftest/README.md.
apiVersion: contracts.rhoai.io/v1alpha1
kind: ContractSet
metadata:
  name: selftest
spec:
  contracts:
    - id: selftest-widgets-v1
      type: openapi
      declaredArtifact: selftest/openapi/widgets.yaml
      matchPath: "^/api/widgets/v1(/|$)"
      policy:
        oasdiffVersion: "1.33.0"
        yqVersion: "4.45.1"
      generator:
        adapter: openapi.static
        source: selftest/openapi/widgets.yaml
    # A Swagger 2.0 contract: converted to OpenAPI 3 before it is compared.
    - id: selftest-gadgets-v1
      type: openapi
      declaredArtifact: selftest/openapi/gadgets.swagger.json
      matchPath: "^/api/gadgets/v1(/|$)"
      policy:
        oasdiffVersion: "1.33.0"
        yqVersion: "4.45.1"
      generator:
        adapter: openapi.static
        source: selftest/openapi/gadgets.swagger.json
