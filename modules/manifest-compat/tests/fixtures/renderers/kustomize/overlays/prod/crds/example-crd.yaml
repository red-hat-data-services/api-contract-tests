# A well-formed CRD fixture: kustomize copies crds/ entries into the rendered
# output verbatim. The shape matters for contract coverage, which identifies
# CRDs by kind plus spec.group/spec.names; the self-test workflow excludes
# this fixture from CRD coverage because it is renderer test data, not a
# served API of this repository.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: examples.demo.io
spec:
  group: demo.io
  names:
    plural: examples
    singular: example
    kind: Example
    listKind: ExampleList
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
